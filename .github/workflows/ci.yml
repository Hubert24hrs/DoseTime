name: DoseTime CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.38.x'  # pubspec.lock needs Flutter >= 3.32
  JAVA_VERSION: '17'

jobs:
  # Run tests and analysis
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      # Report-only: the codebase predates a formatting gate, and formatter
      # output varies between Dart versions.
      - name: Check formatting
        run: dart format --output=none .

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # Build Android APK/AAB
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze_and_test
    # Also build pull requests so Android build breaks are caught before merge.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Build APK (Release)
        run: flutter build apk --release
        continue-on-error: true  # May fail without proper signing

      - name: Build App Bundle
        run: flutter build appbundle --release
        continue-on-error: true  # May fail without proper signing

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  # Build for release with signing (requires secrets)
  release_android:
    name: Release Android
    runs-on: ubuntu-latest
    needs: build_android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Decode and setup keystore (when secrets are configured)
      - name: Signing not configured
        if: env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == ''
        run: echo "::notice::Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to build a signed release bundle."

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        if: env.KEYSTORE_PASSWORD != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Get dependencies
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != ''
        run: flutter pub get

      - name: Purchases not configured
        if: env.REVENUECAT_GOOGLE_API_KEY == ''
        run: echo "::warning::REVENUECAT_GOOGLE_API_KEY is not set; Pro purchases will be unavailable in this bundle."

      # The RevenueCat public SDK key is injected at build time (never stored in source).
      - name: Build signed App Bundle
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != ''
        run: flutter build appbundle --release --dart-define=REVENUECAT_GOOGLE_API_KEY="$REVENUECAT_GOOGLE_API_KEY"

      - name: Upload Release AAB
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 90
